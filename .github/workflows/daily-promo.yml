name: ارسال خودکار پست تبلیغاتی سوین چوب

on:
  schedule:
    # ۱۱:۰۰ صبح به وقت ایران = ۰۷:۳۰ UTC
    - cron: '30 7 * * *'
    # ۲۰:۰۰ شب به وقت ایران = ۱۶:۳۰ UTC
    - cron: '30 16 * * *'
  workflow_dispatch:  # امکان اجرای دستی از تب Actions

jobs:
  send-promo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send promotional post
        run: python bot.py --once
        env:
          # اگر بعداً خواستید از Secrets استفاده کنید، اینجا اضافه کنید
          PYTHONUNBUFFERED: '1'
