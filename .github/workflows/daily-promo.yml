name: ارسال خودکار پست تبلیغاتی سوین چوب

on:
  schedule:
    # ===== صبح (حدود ۱۱:۰۰ ایران = ۰۷:۳۰ UTC) =====
    # چند تلاش پشت‌سرهم تا یکی‌شان نزدیک ساعت ۱۱ بخورد
    - cron: '20 7 * * *'   # ۱۰:۵۰ ایران
    - cron: '30 7 * * *'   # ۱۱:۰۰ ایران
    - cron: '40 7 * * *'   # ۱۱:۱۰ ایران
    - cron: '50 7 * * *'   # ۱۱:۲۰ ایران
    - cron: '0 8 * * *'    # ۱۱:۳۰ ایران (قلب تپنده)

    # ===== شب (حدود ۲۰:۰۰ ایران = ۱۶:۳۰ UTC) =====
    - cron: '20 16 * * *'  # ۱۹:۵۰ ایران
    - cron: '30 16 * * *'  # ۲۰:۰۰ ایران
    - cron: '40 16 * * *'  # ۲۰:۱۰ ایران
    - cron: '50 16 * * *'  # ۲۰:۲۰ ایران
    - cron: '0 17 * * *'   # ۲۰:۳۰ ایران (قلب تپنده)

  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-promo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send promotional post (smart)
        run: python bot.py --smart
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit last_success state
        run: |
          if [ -f last_success.txt ]; then
            git config user.name "SevinChoob Bot"
            git config user.email "bot@sevinchoob.local"
            git add last_success.txt
            git diff --staged --quiet || git commit -m "update last_success [skip ci]"
            git push || true
          fi
