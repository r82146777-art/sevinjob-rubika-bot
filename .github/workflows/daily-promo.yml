name: ارسال خودکار پست تبلیغاتی سوین چوب

on:
  schedule:
    # ===== ارسال اصلی =====
    # ۱۱:۰۰ صبح ایران = ۰۷:۳۰ UTC
    - cron: '30 7 * * *'
    # ۲۰:۰۰ شب ایران = ۱۶:۳۰ UTC
    - cron: '30 16 * * *'

    # ===== قلب تپنده (۳۰ دقیقه بعد) =====
    # ۱۱:۳۰ صبح ایران = ۰۸:۰۰ UTC
    - cron: '0 8 * * *'
    # ۲۰:۳۰ شب ایران = ۱۷:۰۰ UTC
    - cron: '0 17 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'حالت اجرا'
        required: false
        default: 'once'
        type: choice
        options:
          - once
          - heartbeat

permissions:
  contents: write

jobs:
  send-promo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect mode (اصلی یا قلب تپنده)
        id: mode
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          # اگر از workflow_dispatch آمده
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            if [ -z "$MODE" ]; then MODE="once"; fi
          else
            # تشخیص خودکار بر اساس ساعت UTC
            if [ "$HOUR" = "08" ] || [ "$HOUR" = "17" ]; then
              MODE="heartbeat"
            else
              MODE="once"
            fi
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Detected mode: $MODE (UTC $HOUR:$MINUTE)"

      - name: Send promotional post
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "heartbeat" ]; then
            python bot.py --heartbeat
          else
            python bot.py --once
          fi
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit last_success state (اگر تغییر کرده)
        run: |
          if [ -f last_success.txt ]; then
            git config user.name "SevinChoob Bot"
            git config user.email "bot@sevinchoob.local"
            git add last_success.txt
            git diff --staged --quiet || git commit -m "update last_success [skip ci]"
            git push || true
          fi
