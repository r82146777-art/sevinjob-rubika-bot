name: ارسال خودکار پست تبلیغاتی سوین چوب

on:
  schedule:
    # صبح — چند تلاش (بازه وسیع برای تحمل تأخیر)
    - cron: '0 8 * * *'    # ۱۱:۳۰ ایران تقریبی
    - cron: '30 8 * * *'
    - cron: '0 9 * * *'
    - cron: '30 9 * * *'

    # شب
    - cron: '0 17 * * *'   # ۲۰:۳۰ ایران تقریبی
    - cron: '30 17 * * *'
    - cron: '0 18 * * *'
    - cron: '30 18 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-promo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Send text promo (smart)
        run: python bot.py --smart
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit state
        run: |
          if [ -f last_success.txt ]; then
            git config user.name "SevinChoob Bot"
            git config user.email "bot@sevinchoob.local"
            git add last_success.txt
            git diff --staged --quiet || git commit -m "update last_success [skip ci]"
            git push || true
          fi
